<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 반 그림책 도서관</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* ============================================================
   설정은 아래 <script> 맨 위 CONFIG에서 바꿔요.
   ============================================================ */
:root{
  --paper:#EAF2FA; --ink:#1C2A48; --ink-soft:#56627D;
  --sun:#FFC83D; --leaf:#2F9E77; --coral:#E1573F;
  --wood:#B97E45; --wood-dark:#8A5A2E; --white:#fff; --line:#CBD7E6;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;overflow-x:hidden;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn{min-height:46px;padding:0 20px;border-radius:999px;background:var(--ink);color:#fff;font-family:var(--display);font-size:19px;display:inline-flex;align-items:center;gap:8px}
.btn.sun{background:var(--sun);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn.danger{background:var(--coral)}
.btn.small{min-height:38px;font-size:16px;padding:0 14px}
.wrap{max-width:1100px;margin:0 auto;padding:20px}

/* ---------- 서가 ---------- */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding:28px 0 20px}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,6vw,56px);line-height:1.1;margin:0}
.hero p{margin:6px 0 0;color:var(--ink-soft)}
.shelf{--row:236px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));grid-auto-rows:var(--row);
  padding:0 16px;border-radius:10px;background:
  linear-gradient(to bottom,transparent calc(var(--row) - 20px),var(--wood) calc(var(--row) - 20px),var(--wood) calc(var(--row) - 6px),var(--wood-dark) calc(var(--row) - 6px));
  background-size:100% var(--row);background-color:#DDE8F4}
.bk{align-self:end;justify-self:center;margin-bottom:20px;width:128px;text-align:left}
.cover{position:relative;width:128px;height:172px;border-radius:3px 8px 8px 3px;overflow:hidden;background:var(--c,#3E6FB0);
  box-shadow:inset 7px 0 0 rgba(0,0,0,.18),3px 4px 0 rgba(28,42,72,.25);transition:transform .15s}
.bk:active .cover,.bk:hover .cover{transform:translateY(-6px)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ct{position:absolute;left:0;right:0;bottom:0;padding:8px 8px 8px 14px;background:rgba(255,255,255,.93);font-family:var(--display);font-size:15px;line-height:1.25;color:var(--ink)}
.cover .ct small{display:block;font-family:var(--body);font-size:12px;color:var(--ink-soft)}
.cover .num{position:absolute;left:12px;top:8px;background:var(--sun);color:var(--ink);font-family:var(--display);font-size:15px;padding:2px 9px;border-radius:999px}
.themes{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.th{padding:9px 18px;border-radius:999px;border:2px solid var(--line);background:#fff;font-family:var(--display);font-size:17px}
.th[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:#fff}
.th em{font-style:normal;font-family:var(--body);font-size:13px;background:var(--sun);color:var(--ink);border-radius:999px;padding:1px 8px;margin-left:6px}
.example{display:flex;gap:22px;align-items:center;background:#FFF6D8;border-radius:14px;padding:18px 22px;margin-bottom:22px}
.example .cover{flex:0 0 auto}
.example h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 4px}
.example p{margin:0 0 12px;color:var(--ink-soft)}
@media(max-width:560px){.example{flex-direction:column;text-align:center}}
.check{background:#fff;border-radius:14px;padding:18px 20px;margin-bottom:22px}
.check h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.check .top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.check .legend{font-size:14px;color:var(--ink-soft);display:flex;gap:14px;flex-wrap:wrap}
.check .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.nb{border-radius:12px;padding:8px 10px;text-align:left;border:2px dashed var(--line);color:var(--ink-soft);min-height:64px}
.nb b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--ink)}
.nb span{display:block;font-size:14px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb.start{border:2px solid var(--sun);background:#FFF6D8;color:var(--ink)}
.nb.done{border:2px solid var(--leaf);background:#E3F4EC;color:var(--ink)}
.nb.fin{border:2px solid var(--leaf);background:var(--leaf);color:#fff}
.nb.fin b{color:#fff}
.cover .fin{position:absolute;right:8px;top:8px;background:var(--leaf);color:#fff;font-family:var(--display);font-size:14px;padding:2px 9px;border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.btn.go-fin{background:var(--leaf);color:#fff}
.btn.pass{background:var(--coral);color:#fff}
.nb.ok{border:2px solid var(--coral);background:var(--coral);color:#fff}
.nb.ok b{color:#fff}
.nb.redo{border:2px solid var(--coral);background:#FDE8E4;color:var(--ink)}
.nb.cm0{border:2px dashed var(--coral);background:#fff;color:var(--ink)}
.nb.cm{border:2px solid var(--leaf);background:#E3F4EC;color:var(--ink)}
.nb.cm.many{background:var(--leaf);color:#fff}.nb.cm.many b{color:#fff}
.miss{margin:12px 0 0;font-size:15px;color:var(--ink-soft)}
.cover .fin.ok{background:var(--coral)}
/* ---------- 모둠 책 ---------- */
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.gc{border:2px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
.gc .gh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.gc .gh b{font-family:var(--display);font-weight:400;font-size:21px}
.gc .gh span{font-size:14px}
.gc p{margin:2px 0 10px;font-size:14px;color:var(--ink-soft)}
.gc.none{border-style:dashed}
.gc.fin{border-color:var(--leaf);background:#E3F4EC}
.gc.ok{border-color:var(--coral);background:#FDE8E4}
.gc.redo{border-color:var(--sun);background:#FFF6D8}
.who{margin:4px 0 0;font-size:13px;color:var(--ink-soft);line-height:1.45}
.who b{font-weight:bold;color:var(--ink)}
.lock{background:#FDE8E4;border:2px solid var(--coral);border-radius:12px;padding:8px 12px;font-size:15px;margin:0 0 10px}
.chip.busy{border-color:var(--coral);background:#FDE8E4}
.chip.busy::before{content:"✏";position:absolute;left:4px;top:1px;font-size:12px}
.chip.busy.on{background:var(--coral);color:#fff}
.seg.big button{min-height:44px;font-size:17px;padding:6px 16px}
.gdr{display:grid;grid-template-columns:64px minmax(0,1fr);align-items:center;gap:8px;margin-bottom:6px}
.gdr b{font-family:var(--display);font-weight:400;font-size:18px}
.rdwho{margin:-4px 0 0;font-size:14px;color:var(--ink-soft);text-align:center}
.note{max-width:1060px;margin:0 20px 14px;border-radius:14px;padding:14px 18px;font-size:17px;border:2px solid}
.note b{font-family:var(--display);font-weight:400;font-size:20px;display:block;margin-bottom:2px}
.note p{margin:0;white-space:pre-wrap}
.note small{display:block;margin-top:6px;font-size:14px;color:var(--ink-soft)}
.note.ok{background:#FDE8E4;border-color:var(--coral)}
.note.redo{background:#FFF6D8;border-color:var(--sun)}
.follow ul{margin:8px 0 0;padding-left:20px}
.follow li{margin:3px 0}
.follow a{color:var(--ink);font-weight:bold}
.stage .fixed{position:absolute;left:12px;top:12px;z-index:5;background:var(--sun);color:var(--ink);font-family:var(--display);padding:4px 12px;border-radius:999px;font-size:16px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 6px}
.quick button{padding:5px 11px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:14px}
.btn.fin-on{background:#E3F4EC;color:var(--leaf);border:2px solid var(--leaf)}
.empty{padding:40px 0;text-align:center;color:var(--ink-soft)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:28px;color:var(--ink-soft);font-size:14px}
.demo{background:var(--sun);padding:10px 14px;border-radius:10px;font-size:15px;margin-top:8px}

/* ---------- 상단바 ---------- */
.bar{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:2px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar .in{max-width:1100px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0;flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{font-size:14px;color:var(--ink-soft)}
.status.err{color:var(--coral);font-weight:bold}
.tabs{display:flex;gap:6px;max-width:1100px;margin:0 auto;padding:0 20px}
.tab{padding:10px 18px;border-radius:12px 12px 0 0;font-family:var(--display);font-size:18px;color:var(--ink-soft)}
.tab[aria-selected=true]{background:var(--white);color:var(--ink)}
.panel{background:var(--white);border-radius:0 14px 14px 14px;padding:22px;max-width:1060px;margin:0 20px}
@media(min-width:1100px){.panel{margin:0 auto}}

/* ---------- 뼈대 ---------- */
.q{display:grid;grid-template-columns:44px 1fr;gap:4px 12px;padding:14px 0;border-bottom:1px dashed var(--line)}
.q .n{grid-row:span 3;width:40px;height:40px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-family:var(--display);font-size:20px}
.q.key .n{background:var(--sun)}
.q label{font-family:var(--display);font-size:20px}
.guide{margin:6px 0 0;font-size:15px;color:var(--ink-soft)}
.guide.warn{color:var(--coral);font-weight:bold}
.q .hint{font-size:14px;color:var(--ink-soft)}
select,textarea,input[type=text],input[type=password]{width:100%;max-width:100%;overflow-wrap:anywhere;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#FBFDFF;resize:vertical}
textarea:focus,input:focus{border-color:var(--ink);outline:none}
.card{margin-top:22px;padding:18px;border-radius:14px;background:#FFF6D8}
.card h3{font-family:var(--display);font-weight:400;font-size:21px;margin:0 0 4px}
.card p{margin:0 0 10px;font-size:15px;color:var(--ink-soft)}

/* ---------- 쪽 쓰기 ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{flex:0 0 auto;width:52px;height:52px;border-radius:12px;border:2px solid var(--line);font-family:var(--display);font-size:19px;position:relative;background:#fff}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.chip.done::after{content:"";position:absolute;right:5px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--leaf)}
.chip.add{border-style:dashed;border-color:var(--ink);color:var(--ink);font-size:26px;line-height:1}
.mini .ph{cursor:pointer}
.edit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.edit>div{min-width:0}
@media(max-width:820px){.edit{grid-template-columns:1fr}}
.field{margin-bottom:14px}
.field>span{display:block;font-family:var(--display);font-size:18px;margin-bottom:4px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 14px;border-radius:999px;border:2px solid var(--line);font-size:15px}
.seg button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mini{position:relative;width:100%;aspect-ratio:4/3;container-type:size;border-radius:6px;overflow:hidden;box-shadow:0 0 0 2px var(--line)}
.pick{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}

/* ---------- 그림책 쪽 (보기/미리보기 공통) ---------- */
.pg{position:absolute;inset:0;background:#fff;display:grid;padding:5cqw;gap:4cqw;overflow:hidden}
.pg .t{font-size:3.4cqw;line-height:1.75;overflow:hidden;min-height:0;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.pg .im{min-height:0;min-width:0;display:flex;align-items:center;justify-content:center}
.pg .im img{max-width:100%;max-height:100%;object-fit:contain;border-radius:1.2cqw}
.pg .ph{width:100%;height:100%;border:.4cqw dashed var(--line);border-radius:1.2cqw;display:grid;place-items:center;color:var(--ink-soft);font-size:2.6cqw}
.pg .no{position:absolute;bottom:2cqw;right:3cqw;font-size:2.2cqw;color:var(--ink-soft)}
.pg.side{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:center}
.pg.top{grid-template-rows:minmax(0,1.5fr) minmax(0,1fr)}
.pg>*{min-width:0}
.pg.top .t{text-align:center}
.pg.full{padding:0;display:block}
.pg.full .im{position:absolute;inset:0}
.pg.full .im img{width:100%;height:100%;max-width:none;object-fit:cover;border-radius:0}
.pg.full .t{position:absolute;left:4cqw;right:4cqw;bottom:4cqw;max-height:40%;background:rgba(255,255,255,.9);border-radius:1.6cqw;padding:2.4cqw 3cqw}
.pg.text{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);align-items:center;padding:7cqw 9cqw}
.pg.text .t{max-height:100%;width:100%}
.pg.text .t{font-size:3.8cqw;text-align:center}
.pg.cv{background:var(--c,#3E6FB0);padding:0;display:block}
.pg.cv .im{position:absolute;inset:6cqw 6cqw 26cqw}
.pg.cv .ttl{position:absolute;left:6cqw;right:6cqw;bottom:6cqw;background:#fff;border-radius:1.6cqw;padding:2.6cqw 3.6cqw}
.pg.cv .ttl b{display:block;font-family:var(--display);font-weight:400;font-size:5.4cqw;line-height:1.2}
.pg.cv .ttl span{font-size:2.8cqw;color:var(--ink-soft)}
.pg.end{align-content:center;justify-items:center;text-align:center}
.pg.end b{font-family:var(--display);font-weight:400;font-size:9cqw}
.pg.end span{font-size:3cqw;color:var(--ink-soft)}

/* ---------- 보기(넘기는 책) ---------- */
.reader{padding:18px 20px 30px;display:flex;flex-direction:column;align-items:center;gap:14px}
.stage{position:relative;width:min(100%,calc((100dvh - 190px)*4/3));aspect-ratio:4/3;perspective:2200px}
.sheet{position:absolute;inset:0;container-type:size;border-radius:4px 12px 12px 4px;overflow:hidden;background:#fff;box-shadow:inset 10px 0 12px -8px rgba(0,0,0,.25),0 10px 24px rgba(28,42,72,.22)}
.leaf{z-index:2;transform-origin:left center;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:none}
.nav{display:flex;align-items:center;gap:18px}
.nav .cnt{font-family:var(--display);font-size:20px;min-width:80px;text-align:center}
.nav button.arrow{width:58px;height:58px;border-radius:50%;background:var(--ink);color:#fff;font-size:26px}
.nav button.arrow:disabled{opacity:.25}

/* ---------- 감상평 ---------- */
.talk{width:min(100%,calc((100dvh - 190px)*4/3));background:#fff;border-radius:14px;padding:18px 20px}
.talk h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0 0 10px}
.talk .form{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px}
@media(max-width:560px){.talk .form{grid-template-columns:1fr}}
.talk .cnt2{font-size:14px;color:var(--ink-soft)}
.cms{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.cms li{background:var(--paper);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:flex-start}
.cms li div{flex:1;min-width:0;overflow-wrap:anywhere}
.cms b{font-family:var(--display);font-weight:400}
.cms small{color:var(--ink-soft);margin-left:6px}
.cms .x{color:var(--coral);font-size:14px;padding:4px 8px}

/* ---------- 창 ---------- */
dialog{border:0;border-radius:18px;padding:26px;max-width:min(420px,92vw);width:100%;color:var(--ink)}
dialog::backdrop{background:rgba(28,42,72,.45)}
dialog h3{font-family:var(--display);font-weight:400;font-size:26px;margin:0 0 14px}
dialog .err{color:var(--coral);font-size:15px;min-height:22px;margin:6px 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<dialog id="login">
  <h3>내 책 열기</h3>
  <div class="field" id="lgThF"><span>어느 책장에 쓸까요?</span><select id="lgTh"></select></div>
  <div class="field" id="lgGrpF" style="display:none"><span>우리 모둠</span><div class="seg big" id="lgGrp"></div></div>
  <div class="field" id="lgMemF" style="display:none"><span>내 번호</span><div class="seg big" id="lgMem"></div></div>
  <div class="field" id="lgNumF"><span>번호</span><select id="lgNum"></select></div>
  <p id="lgWho" style="margin:-4px 0 12px;font-size:15px;display:none"></p>
  <div class="field" id="lgNameF"><span>이름</span><input type="text" id="lgName" autocomplete="off" placeholder="예: 하늘"></div>
  <div class="field" id="lgPinF"><span>비밀번호 (숫자 4자리)</span><input type="password" id="lgPin" inputmode="numeric" maxlength="4" autocomplete="off"></div>
  <p class="hint" id="lgHint" style="font-size:14px;color:var(--ink-soft);margin:0">처음이면 지금 정한 비밀번호로 새 책이 만들어져요.</p>
  <div class="err" id="lgErr"></div>
  <div class="row" style="justify-content:flex-end">
    <button class="btn ghost small" id="lgCancel">닫기</button>
    <button class="btn sun" id="lgGo">책 열기</button>
  </div>
</dialog>
<dialog id="rev">
  <h3>선생님 확인</h3>
  <p id="revInfo" style="margin:-6px 0 12px;font-size:15px;color:var(--ink-soft)"></p>
  <label class="field"><span>학생에게 남길 말 <small style="font-size:14px;color:var(--ink-soft)">(통과는 비워도 돼요)</small></span>
    <textarea id="revMsg" rows="3" maxlength="200" placeholder="예: 5쪽 그림을 더 채워 보자!"></textarea></label>
  <div class="quick" id="revQuick"></div>
  <div class="err" id="revErr"></div>
  <div class="row" style="justify-content:space-between">
    <button class="btn ghost small" id="revClear">확인 지우기</button>
    <div class="row">
      <button class="btn ghost small" id="revNo">닫기</button>
      <button class="btn sun small" id="revRedo">더 해 보기</button>
      <button class="btn pass small" id="revOk">★ 통과</button>
    </div>
  </div>
</dialog>
<dialog id="ask">
  <h3 id="askT"></h3>
  <p id="askP" style="margin:0 0 12px;white-space:pre-wrap;max-height:55vh;overflow:auto"></p>
  <input type="text" id="askIn" style="display:none;margin-bottom:12px">
  <textarea id="askTa" rows="5" readonly style="display:none;margin-bottom:12px"></textarea>
  <div class="row" style="justify-content:flex-end">
    <button class="btn ghost small" id="askNo">취소</button>
    <button class="btn sun" id="askOk">확인</button>
  </div>
</dialog>
<dialog id="grpDlg">
  <h3>모둠 정하기</h3>

/* ---------- 저장소 (Firestore 또는 연습 모드) ----------
   storybook_shelf/{책}   : 책장에 보이는 정보(제목, 지은이, 작은 표지)
   storybook_books/{책}   : 책 내용(글, 쪽 모양, 비밀번호)
   storybook_imgs/{책__쪽} : 그림 한 장씩 따로 저장
*/
const COL = { shelf:"storybook_shelf", books:"storybook_books", imgs:"storybook_imgs", comments:"storybook_comments" };
async function api(method, path, body){
  if (DEMO) return demoApi(method, path, body);
  const [kind, id, key] = path.split("/");
  if (kind === "comments"){
    const col = DB.collection(COL.comments);
    if (!id && method === "GET"){ const snap = await col.get(); const out = {}; snap.forEach(d => out[d.id] = d.data()); return out; }
    if (method === "GET"){
      const snap = await col.where("book","==",id).get(); const out = {};
      snap.forEach(d => out[d.id.split("__")[1]] = d.data()); return out;
    }
    if (method === "PUT") return col.doc(`${id}__${key}`).set({ ...body, book:id });
    if (method === "DELETE"){
      if (key) return col.doc(`${id}__${key}`).delete();
      const snap = await col.where("book","==",id).get();
      return Promise.all(snap.docs.map(d => d.ref.delete()));
    }
  }
  if (kind === "imgs"){
    const col = DB.collection(COL.imgs);
    if (method === "GET"){
      const snap = await col.where("book","==",id).get(); const out = {};
      snap.forEach(d => out[d.data().key] = d.data().data); return out;
    }
    if (method === "PUT") return col.doc(`${id}__${key}`).set({ book:id, key, data:body });
    if (method === "DELETE"){
      if (key) return col.doc(`${id}__${key}`).delete();
      const snap = await col.where("book","==",id).get();
      return Promise.all(snap.docs.map(d => d.ref.delete()));
    }
  }
  const col = DB.collection(COL[kind]);
  if (!id && method === "GET"){ const snap = await col.get(); const out = {}; snap.forEach(d => out[d.id] = d.data()); return out; }
  const ref = col.doc(id);
  if (method === "GET"){ const d = await ref.get(); return d.exists ? d.data() : null; }
  if (method === "PUT") return ref.set(body);
  if (method === "PATCH") return id === "_settings" ? ref.set(body, { merge:true }) : ref.update(body);
  if (method === "DELETE") return ref.delete();
}
let MEM = null;
function demoRead(){
  if (MEM) return MEM;
  try { return JSON.parse(localStorage.getItem("csb-demo") || "{}"); } catch(e){ MEM = {}; return MEM; }
}
function demoWrite(tree){ if (!MEM){ try { localStorage.setItem("csb-demo", JSON.stringify(tree)); } catch(e){ MEM = tree; } } }
function demoApi(method, path, body){
  const tree = demoRead();
  const parts = path.split("/").filter(Boolean);
  const last = parts.pop();
  let node = tree;
  for (const p of parts){
    if (method === "GET" && (node[p] == null)) return null;
    node = node[p] = node[p] || {};
  }
  if (method === "GET") return JSON.parse(JSON.stringify(last ? node[last] ?? null : node));
  if (method === "PUT") node[last] = body;
  if (method === "PATCH"){
    if (!node[last] && last !== "_settings"){ const e = new Error("not-found"); e.code = "not-found"; throw e; }
    node[last] = Object.assign(node[last] || {}, body);
  }
  if (method === "DELETE") delete node[last];
  demoWrite(tree);
  return body ?? null;
}

/* ---------- 모둠 책: 여러 명이 함께 고치는 책 ----------
   쪽마다 따로 저장해서(pg.쪽아이디.글) 친구끼리 서로 덮어쓰지 않아요.
   쪽 순서는 order 목록에 넣고 빼기만 해요. */
const DEL = { __op:"del" }, UNION = (...v) => ({ __op:"union", v }), REMOVE = (...v) => ({ __op:"remove", v });
async function gUpdate(id, fields){
  if (DEMO){
    const tree = demoRead(), doc = tree.books && tree.books[id];
    if (!doc){ const e = new Error("not-found"); e.code = "not-found"; throw e; }
    for (const [path, v] of Object.entries(fields)){
      const segs = path.split("."), k = segs.pop(); let node = doc;
      for (const sg of segs) node = node[sg] = (node[sg] && typeof node[sg] === "object") ? node[sg] : {};
      const cur = Array.isArray(node[k]) ? node[k] : [];
      if (v && v.__op === "del") delete node[k];
      else if (v && v.__op === "union") node[k] = cur.concat(v.v.filter(x => !cur.includes(x)));
      else if (v && v.__op === "remove") node[k] = cur.filter(x => !v.v.includes(x));
      else node[k] = JSON.parse(JSON.stringify(v));
    }
    demoWrite(tree); return;
  }
  const FV = firebase.firestore.FieldValue, out = {};
  for (const [k, v] of Object.entries(fields))
    out[k] = v && v.__op === "del" ? FV.delete() : v && v.__op === "union" ? FV.arrayUnion(...v.v) : v && v.__op === "remove" ? FV.arrayRemove(...v.v) : v;
  return DB.collection(COL.books).doc(id).update(out);
}
// 고칠 것을 모아 두었다가 한꺼번에 보내요 (같은 쪽을 통째로 넣은 것과 겹치지 않게 정리)
function gset(path, val){
  const d = S.gd, m = path.match(/^pg\.([^.]+)\.(.+)$/);
  if (m){
    const whole = d[`pg.${m[1]}`];
    if (whole && whole.__op === "del") return;
    if (whole && typeof whole === "object" && !whole.__op){
      whole[m[2]] = val && val.__op === "union" ? [...new Set([...(whole[m[2]] || []), ...val.v])] : val;
      return;
    }
  }
  if (/^pg\.[^.]+$/.test(path)) for (const k in d) if (k.startsWith(path + ".")) delete d[k];
  if (val && val.__op === "union" && d[path] && d[path].__op === "union") val = UNION(...new Set([...d[path].v, ...val.v]));
  d[path] = val;
}
const TAB = uid();                       // 이 기기(창)를 알아보는 표시
const ME = () => { const m = S.me || {}; return m.num ? `${m.num}번 ${m.name}` : (m.name || "선생님"); };
const LK = {};                           // 쪽마다 '쓰는 중' 표시를 언제 봤는지
const LOCK_MS = 30000;                   // 30초 동안 안 쓰면 다른 친구가 쓸 수 있어요
function seeLock(p){
  const sig = p.lk ? `${p.lk.k}:${p.lk.t}` : "";
  if (!LK[p.pid] || LK[p.pid].sig !== sig) LK[p.pid] = { sig, at:Date.now() };
}
function lockedByOther(p){
  if (!S.grp || !p || !p.lk || p.lk.k === TAB) return false;
  const seen = LK[p.pid];
  return !!seen && Date.now() - seen.at < LOCK_MS && Math.abs(Date.now() - (p.lk.t || 0)) < 600000;
}
function startLive(id){
  stopLive();
  const onBook = data => { if (!data || S.id !== id || S.view !== "edit") return; mergeRemote(data); liveRefresh(); };
  S.tick = setInterval(liveRefresh, 4000);
  if (DEMO){
    const read = () => { const t = demoRead(); return [t.books && t.books[id], (t.imgs && t.imgs[id]) || {}]; };
    S.imgs = JSON.parse(JSON.stringify(read()[1]));
    let isig = Object.entries(S.imgs).map(([k,v]) => k + v.length).join();
    const h = e => {
      if (e.key !== "csb-demo") return;
      const [bk, im] = read(); onBook(bk);
      const sig = Object.entries(im).map(([k,v]) => k + v.length).join();
      if (sig !== isig){ isig = sig; S.imgs = JSON.parse(JSON.stringify(im)); S.imgVer = (S.imgVer || 0) + 1; liveRefresh(); }
    };
    window.addEventListener("storage", h);
    S.stop = [() => window.removeEventListener("storage", h)];
    return Promise.resolve();
  }
  return new Promise(res => {
    let first = true;
    const ready = () => { if (first){ first = false; res(); } };
    S.stop = [
      DB.collection(COL.books).doc(id).onSnapshot(d => onBook(d.data()), () => setStatus("error")),
      DB.collection(COL.imgs).where("book","==",id).onSnapshot(qs => {
        qs.docChanges().forEach(ch => { const d = ch.doc.data(); if (ch.type === "removed") delete S.imgs[d.key]; else S.imgs[d.key] = d.data; });
        S.imgVer = (S.imgVer || 0) + 1; if (first) ready(); else liveRefresh();
      }, () => ready())
    ];
    setTimeout(ready, 8000);
  });
}
function stopLive(){ (S.stop || []).forEach(f => { try { f(); } catch(e){} }); S.stop = []; clearInterval(S.tick); }
// 다른 친구가 고친 내용을 받아서 합쳐요. 아직 안 보낸 내 글은 그대로 둬요.
function mergeRemote(data){
  const b = S.book, r = normalize(data), d = S.gd, cur = new Map(b.pages.map(p => [p.pid, p]));
  const whole = pid => d[`pg.${pid}`] && !d[`pg.${pid}`].__op;
  const pages = r.pages.map(rp => {
    const lp = cur.get(rp.pid); if (!lp) return rp;
    for (const k in rp) if (k !== "pid" && !whole(rp.pid) && d[`pg.${rp.pid}.${k}`] === undefined) lp[k] = rp[k];
    return lp;
  });
  b.pages.forEach(lp => { if (whole(lp.pid) && !pages.includes(lp)) pages.push(lp); });
  pages.forEach(seeLock);
  for (const k in r) if (!["pages","pg","order","title"].includes(k)) b[k] = r[k];
  const ae = document.activeElement;
  if (d.title === undefined && !(ae && ae.id === "ttl")) b.title = r.title;
  b.pages = pages;
}
const liveSig = () => JSON.stringify([S.tab, S.book.title, S.imgVer || 0, S.book.pages.map(p =>
  [p.pid, p.text, p.layout, p.hasImg, p.by, p.eds.length, lockedByOther(p) ? p.lk.n : ""])]);
const barSig = () => JSON.stringify([S.book.done, S.book.rev, S.book.revMsg]);
function liveRefresh(){
  if (S.view !== "edit" || !S.grp || !$("#panel")) return;
  const ae = document.activeElement, typing = !!ae && (ae.id === "pgText" || ae.id === "ttl");
  if (!typing && barSig() !== S.barSig){ renderEditor(); return; }
  if (liveSig() === S.lastSig) return;
  const h2 = document.querySelector(".bar h2"); if (h2 && !typing) h2.textContent = S.book.title || "제목 없는 책";
  if (S.tab !== "pages"){ if (!typing) renderCover(); return; }
  const i = S.book.pages.findIndex(p => p.pid === S.pagePid);
  if (i < 0){
    toast("다른 친구가 이 쪽을 지웠어요");
    if (typing) ae.blur();
    S.page = Math.max(0, Math.min(S.page, S.book.pages.length - 1)); renderPages(); return;
  }
  S.page = i;
  const p = S.book.pages[i];
  if (!typing){ renderPages(); return; }
  if (lockedByOther(p)){ ae.blur(); renderPages(); return; }
  $("#chips").innerHTML = chipsHTML(); wireChips(); $("#who").innerHTML = whoHTML(p);
  S.lastSig = liveSig();
}

/* ---------- 창 도우미 (prompt/confirm은 막히는 곳이 많아서 쓰지 않아요) ---------- */
function openDlg(d){ if (d.showModal) { try { d.showModal(); return; } catch(e){} } d.setAttribute("open",""); }
function closeDlg(d){ if (d.close) d.close(); else d.removeAttribute("open"); }
function ask({ title, text="", input=null, copy=null, ok="확인", cancel="취소", danger=false }){
  return new Promise(res => {
    const d = $("#ask"), inp = $("#askIn"), ta = $("#askTa"), okB = $("#askOk"), noB = $("#askNo");
    $("#askT").textContent = title; $("#askP").textContent = text;
    inp.style.display = input ? "block" : "none"; inp.value = (input && input.value != null) ? input.value : "";
    if (input){ inp.type = input.type || "text"; inp.placeholder = input.placeholder || ""; inp.inputMode = input.mode || "text"; }
    ta.style.display = copy ? "block" : "none"; ta.value = copy || "";
    okB.textContent = ok; okB.className = danger ? "btn danger" : "btn sun";
    noB.textContent = cancel; noB.style.display = cancel ? "" : "none";
    const done = v => { closeDlg(d); okB.onclick = noB.onclick = inp.onkeydown = null; res(v); };
    okB.onclick = () => done(input ? inp.value : true);
    noB.onclick = () => done(false);
    inp.onkeydown = e => { if (e.key === "Enter") okB.click(); };
    d.oncancel = e => { e.preventDefault(); done(false); };
    openDlg(d);
    if (input) setTimeout(() => inp.focus(), 50);
    if (copy) setTimeout(() => { ta.focus(); ta.select(); }, 50);
  });
}

/* ---------- 번호 ---------- */
let ROSTER = { max:CONFIG.MAX_NUMBER, skip:CONFIG.SKIP_NUMBERS.slice() };
// 책장(주제): 처음 만든 책들은 모두 "t1" 책장에 들어가요
let THEMES = [{ id:"t1", name:"첫 번째 책장" }], ACTIVE = "t1", NAMES = {};
async function loadRoster(){
  try {
    const r = await api("GET","books/_settings");
    if (r && r.max) ROSTER = { max:+r.max, skip:(r.skip||[]).map(Number) };
    if (r && Array.isArray(r.themes) && r.themes.length){ THEMES = r.themes; ACTIVE = r.active || THEMES[THEMES.length-1].id; }
    if (r && r.names) NAMES = r.names;
  } catch(e){}
  if (!S.viewTheme || !THEMES.some(t => t.id === S.viewTheme)) S.viewTheme = ACTIVE;
}
const saveSettings = obj => api("PATCH","books/_settings", obj);
const themeOf = b => (b && b.theme) || "t1";
const themeName = id => (THEMES.find(t => t.id === id) || {}).name || "책장";
const rosterNums = () => Array.from({length:ROSTER.max}, (_,i) => i+1).filter(n => !ROSTER.skip.includes(n));
const bookByNum = (n, th) => Object.entries(S.shelf).find(([,b]) => b.num != null && b.num !== "" && +b.num === +n && (th == null || themeOf(b) === th));
// 모둠 책장: 책장 설정에 groups(모둠마다 번호 목록)가 있으면 모둠 책장이에요
const thObj = id => THEMES.find(t => t.id === id) || {};
const isGroupTh = id => Array.isArray(thObj(id).groups);
const groupsOf = id => (thObj(id).groups || []).map(g => Array.isArray(g) ? g : (g && Array.isArray(g.m) ? g.m : []));
const groupOf = (n, th) => { const i = groupsOf(th).findIndex(g => g.map(Number).includes(+n)); return i < 0 ? 0 : i + 1; };
// 번호를 아직 안 정한 모둠은, 다른 모둠에 들어가지 않은 번호를 모두 보여 줘요
const membersOf = (g, th) => { const m = groupsOf(th)[g-1] || []; return m.length ? m : rosterNums().filter(n => !groupOf(n, th)); };
const gid = (th, g) => `g_${th}_${g}`;
const bookByGroup = (g, th) => Object.entries(S.shelf).find(([,b]) => b.grp != null && +b.grp === +g && themeOf(b) === th);
const knownName = n => { const f = bookByNum(n, ACTIVE) || bookByNum(n); return (f && f[1].author) || NAMES[n] || ""; };
const sortKey = b => b.grp != null ? +b.grp : b.num ? +b.num : 999;
const crew = b => [...new Set(b.pages.flatMap(p => p.eds || []))].filter(x => x !== "선생님").sort((a,c) => parseInt(a) - parseInt(c));
const isExample = b => b && b.num != null && b.num !== "" && +b.num === 0;   // 0번 = 선생님 예시 책

/* ---------- 도우미 ---------- */
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("on"),2200); }
function normalize(b){
  const grp = Array.isArray(b.order) && b.pg && typeof b.pg === "object";
  const raw = grp ? b.order.filter(pid => b.pg[pid]).map(pid => ({ ...b.pg[pid], pid }))
                  : (Array.isArray(b.pages) ? b.pages : Object.values(b.pages || {}));
  const pages = raw.filter(Boolean).map(p => {
    const q = { pid:p.pid || uid(), text:p.text || "", layout:p.layout || "side", hasImg:!!p.hasImg, ed:p.ed || 0 };
    if (grp) Object.assign(q, { by:p.by || "", at:p.at || 0, eds:Array.isArray(p.eds) ? p.eds : [], lk:p.lk || null });
    return q;
  });
  return { ...b, title:b.title || "", pages };
}
function newBook(name, pin, num, theme){
  return { author:name, pin, num, theme, title:`${name}의 이야기`,
    pages:Array.from({length:CONFIG.DEFAULT_PAGES}, () => ({ pid:uid(), text:"", layout:"side", hasImg:false })),
    created:Date.now(), updated:Date.now() };
}
function loadImage(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; }); }
async function shrink(src, max, q=0.82){
  const img = await loadImage(src);
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
  const x = c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height);
  x.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", q);
}

/* ---------- 글이 넘치면 글씨 크기를 줄여 쪽 안에 맞추기 ---------- */
function fitText(root){
  if (!root) return;
  root.querySelectorAll(".pg .t").forEach(t => {
    t.style.fontSize = "";
    let size = parseFloat(getComputedStyle(t).fontSize);
    const min = size * 0.45;
    while (t.scrollHeight > t.clientHeight + 1 && size > min){
      size *= 0.93; t.style.fontSize = size + "px";
    }
  });
}
function guideHTML(p){
  const [max, sent] = LIMITS[p.layout] || LIMITS.side;
  const n = p.text.replace(/\n/g, "").length;
  return n > max
    ? `<p class="guide warn" id="guide">글이 많아서 글씨가 작아져요. 다음 쪽으로 나눠 써 보세요. (${n} / ${max}자)</p>`
    : `<p class="guide" id="guide">이 모양은 ${sent}문장(${max}자) 정도까지 들어가요. 지금 ${n}자</p>`;
}

/* ---------- 쪽 그리기 (보기·미리보기 공통) ---------- */
function pageHTML(p, img, num, preview){
  let lay = p.layout;
  if (!img && lay !== "text" && !preview) lay = "text";
  const im = lay === "text" ? "" :
    `<div class="im">${img ? `<img src="${img}" alt="">` : `<div class="ph">그림을 넣어 주세요</div>`}</div>`;
  const tx = `<div class="t">${esc(p.text) || (preview ? '<span style="color:var(--ink-soft)">여기에 글이 들어가요</span>' : "")}</div>`;
  return `<div class="pg ${lay}">${im}${tx}${num ? `<span class="no">${num}</span>` : ""}</div>`;
}
function coverHTML(b, id, img){
  return `<div class="pg cv" style="--c:${colorOf(id)}">
    ${img ? `<div class="im"><img src="${img}" alt=""></div>` : ""}
    <div class="ttl"><b>${esc(b.title || "제목 없는 책")}</b><span>지은이 ${esc(b.author)}</span></div></div>`;
}
function coverImg(){
  if (S.imgs.cover) return S.imgs.cover;
  const p = S.book.pages.find(p => S.imgs[p.pid]);
  return p ? S.imgs[p.pid] : null;
}

      text:`${wrote.length ? `쓴 감상평\n${wrote.join("\n")}` : "아직 쓴 감상평이 없어요."}\n\n아직 안 쓴 책 (${left.length}권)\n${left.join("\n") || "· 없어요. 다 썼어요!"}`,
      ok:"닫기", cancel:null });
  });
  if ($("#setNums")) $("#setNums").onclick = async () => {
    const max = await ask({ title:"번호 설정", text:"마지막 번호를 적어 주세요.", input:{ mode:"numeric", value:String(ROSTER.max) }, ok:"다음" });
    if (max === false) return;
    if (!/^\d+$/.test(max.trim()) || +max < 1 || +max > 60){ toast("1~60 사이 숫자로 적어 주세요"); return; }
    const skip = await ask({ title:"번호 설정", text:"없는 번호를 쉼표로 적어 주세요.\n없으면 비워 두세요. (예: 23, 24)", input:{ value:ROSTER.skip.join(", ") }, ok:"저장" });
    if (skip === false) return;
    const list = skip.split(/[,\s]+/).filter(Boolean).map(Number).filter(n => n >= 1);
    try { await saveSettings({ max:+max, skip:list }); toast("번호를 저장했어요"); showShelf(); }
    catch(e){ toast("저장하지 못했어요. 다시 해 보세요"); }
  };
}

/* ---------- 모둠 정하기 (선생님) ---------- */
function splitNums(nums, k){
  const out = [], base = Math.floor(nums.length / k), extra = nums.length % k; let i = 0;
  for (let g = 0; g < k; g++){ const n = base + (g < extra ? 1 : 0); out.push(nums.slice(i, i + n)); i += n; }
  return out;
}
function editGroups(th){
  return new Promise(res => {
    const d = $("#grpDlg"), sel = $("#gdN"), nums = rosterNums();
    let gs = groupsOf(th).map(g => g.slice());
    if (!gs.length) gs = Array.from({length:Math.min(8, Math.max(2, Math.round(nums.length / 4)))}, () => []);
    sel.innerHTML = Array.from({length:11}, (_,i) => i + 2).map(n => `<option value="${n}">${n}개</option>`).join("");
    sel.value = String(gs.length);
    const parse = v => v.split(/[^0-9]+/).filter(Boolean).map(Number);
    const read = () => [...document.querySelectorAll("#gdRows input")].map(i => parse(i.value));
    const left = () => {
      const used = read().flat(), miss = nums.filter(n => !used.includes(n));
      $("#gdLeft").textContent = !used.length ? "아직 번호를 정하지 않았어요. 모둠 수만 저장할 수 있어요." : miss.length ? `아직 모둠이 없는 번호: ${miss.join(", ")}` : "모든 번호가 모둠에 들어갔어요.";
      $("#gdErr").textContent = "";
    };
    const draw = () => {
      $("#gdRows").innerHTML = gs.map((g,i) => `<label class="gdr"><b>${i+1}모둠</b><input type="text" value="${g.join(", ")}" autocomplete="off" placeholder="나중에 정해도 돼요"></label>`).join("");
      document.querySelectorAll("#gdRows input").forEach(i => i.oninput = left); left();
    };
    sel.onchange = () => { gs = read(); const k = +sel.value; while (gs.length < k) gs.push([]); gs = gs.slice(0, k); draw(); };
    $("#gdAuto").onclick = () => { gs = splitNums(nums, +sel.value); draw(); };
    const done = v => { closeDlg(d); res(v); };
    $("#gdNo").onclick = () => done(false);
    d.oncancel = e => { e.preventDefault(); done(false); };
    $("#gdOk").onclick = async () => {
      const g2 = read(), all = g2.flat(), err = $("#gdErr");
      const dup = [...new Set(all.filter((n,i) => all.indexOf(n) !== i))], bad = [...new Set(all.filter(n => !nums.includes(n)))];
      if (dup.length){ err.textContent = `${dup.join(", ")}번이 두 모둠에 들어 있어요.`; return; }
      if (bad.length){ err.textContent = `${bad.join(", ")}번은 우리 반 번호에 없어요. (번호 설정을 확인하세요)`; return; }
      const themes = THEMES.map(t => t.id === th ? { ...t, groups:g2.map(m => ({ m })) } : t);
      err.textContent = "저장하고 있어요…";
      try { await saveSettings({ themes, active:ACTIVE }); THEMES = themes; toast("모둠을 저장했어요"); done(true); }
      catch(e){ err.textContent = "저장하지 못했어요. 인터넷을 확인하세요."; }
    };
    draw(); openDlg(d);
  });
}
// 선생님이 모둠 책을 만들어요. 다른 모둠 책이 있으면 내용을 그대로 복사해서 시작할 수도 있어요.
async function makeGroupBook(th, g){
  const id = gid(th, g);
  try {
    const old = await api("GET", `books/${id}`);
    if (old){ openEditor(id, old); return; }
    const others = Object.entries(S.shelf).filter(([,b]) => b.grp != null && themeOf(b) === th).sort((a,b) => a[1].grp - b[1].grp);
    let src = null;
    if (others.length){
      const o = others[0];
      if (await ask({ title:`${g}모둠 책 만들기`, text:`${o[1].grp}모둠 책의 글·그림·쪽 모양을 그대로 복사해서 시작할까요?\n'빈 책으로'를 누르면 1쪽짜리 빈 책이 만들어져요.`, ok:`${o[1].grp}모둠 책 복사`, cancel:"빈 책으로" })) src = o[0];
    }
    toast("모둠 책을 만들고 있어요…");
    const now = Date.now(), pid = uid();
    const book = { grp:g, theme:th, author:`${g}모둠`, title:`${g}모둠의 이야기`, order:[pid], pg:{ [pid]:{ text:"", layout:"side", hasImg:false } }, created:now, updated:now };
    const imgs = {}; let thumb = null;
    if (src){
      const sb = normalize(await api("GET", `books/${src}`) || {}), si = await api("GET", `imgs/${src}`) || {}, map = {};
      book.title = sb.title || book.title; book.order = []; book.pg = {};
      sb.pages.forEach(p => { const n = uid(); map[p.pid] = n; book.order.push(n);
        book.pg[n] = { text:p.text, layout:p.layout, hasImg:!!si[p.pid], by:"선생님", at:now, eds:["선생님"] }; });
      if (!book.order.length){ book.order = [pid]; book.pg = { [pid]:{ text:"", layout:"side", hasImg:false } }; }
      for (const k in si){ const nk = k === "cover" ? "cover" : map[k]; if (nk) imgs[nk] = si[k]; }
      thumb = (S.shelf[src] || {}).thumb || null;
    }
    await api("PUT", `books/${id}`, book);
    for (const k in imgs) await api("PUT", `imgs/${id}/${k}`, imgs[k]);
    const sh = { title:book.title, author:book.author, grp:g, theme:th, pages:book.order.length,
      written:book.order.filter(k => book.pg[k].text.trim()).length, updated:now };
    if (thumb) sh.thumb = thumb;
    await api("PUT", `shelf/${id}`, sh);
    openEditor(id, book);
  } catch(e){ console.error(e); toast("만들지 못했어요. 다시 해 보세요"); }
}

let saveTimer = null, pending = false;
function setStatus(s){
  const el = $("#status"); if (!el) return;
  el.className = "status" + (s==="error" ? " err" : "");
  el.textContent = { saving:"저장 중…", saved:"저장됨", error:"저장 안 됨 — 인터넷을 확인하세요" }[s];
}
function touch(p){ if (S.teacher) return; const t = Date.now(); if (p) p.ed = t; else S.book.cvEd = t; }
// 무엇을 고쳤는지 알려 주면 저장해요. 모둠 책은 고친 칸만, 고친 사람과 함께 보내요.
function changed(p, ...keys){
  if (!S.grp){ touch(p); queueSave(); return; }
  const now = Date.now(), me = ME();
  if (p){
    keys.forEach(k => gset(`pg.${p.pid}.${k}`, p[k]));
    p.by = me; p.at = now; if (!p.eds.includes(me)) p.eds.push(me);
    gset(`pg.${p.pid}.by`, me); gset(`pg.${p.pid}.at`, now); gset(`pg.${p.pid}.eds`, UNION(me));
    if (!S.teacher){ p.ed = now; gset(`pg.${p.pid}.ed`, now); }
    if (keys.includes("text")){ p.lk = { k:TAB, n:me, t:now }; gset(`pg.${p.pid}.lk`, p.lk); }
  } else {
    keys.forEach(k => gset(k, S.book[k]));
    gset("cvBy", me);
    if (!S.teacher){ S.book.cvEd = now; gset("cvEd", now); }
  }
  queueSave();
}
function queueSave(){ pending = true; setStatus("saving"); clearTimeout(saveTimer); saveTimer = setTimeout(flushSave, 700); }
async function flushSave(){
  clearTimeout(saveTimer); if (!pending || !S.book) return;
  pending = false; const b = S.book, now = Date.now();
  if (S.grp) return flushGroup(b, now);
  try {
    await api("PATCH", `books/${S.id}`, { title:b.title, pages:b.pages, updated:now, cvEd:b.cvEd || 0, delAt:b.delAt || 0 });
    await api("PATCH", `shelf/${S.id}`, { title:b.title, author:b.author, pages:b.pages.length, written:b.pages.filter(p => p.text.trim()).length, updated:now });
    setStatus("saved");
  } catch(e){
    if (e && e.code === "not-found"){ pending = false; S.book = null; toast("이 책은 지워졌어요. 선생님께 말씀해 주세요"); showShelf(); return; }
    pending = true; setStatus("error");
  }
}
async function flushGroup(b, now){
  const d = S.gd, id = S.id; S.gd = {};
  try {
    if (Object.keys(d).length) await gUpdate(id, { ...d, updated:now });
    const sh = { title:b.title, author:b.author, pages:b.pages.length, written:b.pages.filter(p => p.text.trim()).length };
    const sig = JSON.stringify(sh);
    if (sig !== S.shSent){ await api("PATCH", `shelf/${id}`, { ...sh, updated:now }); S.shSent = sig; }
    if (S.id === id) setStatus(pending ? "saving" : "saved");
  } catch(e){
    if (e && e.code === "not-found"){ S.book = null; toast("이 책은 지워졌어요. 선생님께 말씀해 주세요"); showShelf(); return; }
    if (S.id !== id) return;
    const newer = S.gd; S.gd = d; for (const k in newer) gset(k, newer[k]);   // 못 보낸 것을 다시 모아 두고
    pending = true; setStatus("error"); clearTimeout(saveTimer); saveTimer = setTimeout(flushSave, 4000);
  }
}

/* ---------- 선생님 확인 ---------- */
function noteHTML(b){
  const msg = b.revMsg ? `<p>${esc(b.revMsg)}</p>` : "";
  if (b.rev === "ok") return `<div class="note ok"><b>★ 선생님 확인 통과!</b>${msg}</div>`;
  if (b.rev === "redo") return `<div class="note redo"><b>선생님이 조금 더 해 보자고 하셨어요</b>${msg}
    <small>${b.done ? "다시 냈어요. 선생님 확인을 기다려요." : "다 고치면 '다 만들었어요'를 다시 눌러 주세요."}</small></div>`;
  return "";
}
const QUICK = ["그림을 더 채워 보자", "색칠을 마무리하자", "글을 조금 더 써 보자", "맞춤법을 고쳐 보자", "표지를 완성하자", "제목을 정해 보자"];
function openReview(id, b){
  return new Promise(res => {
    const d = $("#rev"), msg = $("#revMsg"), err = $("#revErr");
    $("#revInfo").textContent = `${b.num ? b.num + "번 " : ""}${b.author} · ${b.title || "제목 없는 책"} · ${b.done ? "완료함" : "아직 완료 안 함"}`;
    if (b.rev === "redo"){ const ch = changedSince(b);
      $("#revInfo").textContent += ` · ${b.revSeen ? "피드백 읽음" : "피드백 안 읽음"} · 고친 곳 ${ch.length ? ch.join(", ") : "없음"}`; }
    msg.value = b.revMsg || ""; err.textContent = "";
    $("#revQuick").innerHTML = QUICK.map(q => `<button type="button">${q}</button>`).join("");
    $("#revQuick").querySelectorAll("button").forEach(q => q.onclick = () => {
      msg.value = (msg.value.trim() ? msg.value.trim() + "\n" : "") + q.textContent + "."; msg.focus(); });
    $("#revClear").style.display = b.rev ? "" : "none";
    const save = async data => {
      err.textContent = "저장하고 있어요…";
      try {
        await api("PATCH", `books/${id}`, data); await api("PATCH", `shelf/${id}`, data);
        Object.assign(b, data); if (S.shelf[id]) Object.assign(S.shelf[id], data);
        closeDlg(d); res(true);
      } catch(e){ err.textContent = "저장하지 못했어요. 인터넷을 확인하세요."; }
    };
    $("#revOk").onclick = () => save({ rev:"ok", revMsg:msg.value.trim(), revAt:Date.now(), revSeen:null, revReply:null });
    $("#revRedo").onclick = () => {
      if (!msg.value.trim()){ err.textContent = "더 해 볼 것을 적어 주세요. (아래 단추를 눌러도 돼요)"; return; }
      save({ rev:"redo", revMsg:msg.value.trim(), revAt:Date.now(), revSeen:null, revReply:null, done:false, doneAt:null });
    };
    $("#revClear").onclick = () => save({ rev:null, revMsg:"", revAt:null, revSeen:null, revReply:null });
    $("#revNo").onclick = () => { closeDlg(d); res(false); };
    d.oncancel = e => { e.preventDefault(); closeDlg(d); res(false); };
    openDlg(d);
  });
}
function changedSince(b){
  const t = b.revAt || 0, out = [];
  if ((b.cvEd || 0) > t) out.push("표지");
  b.pages.forEach((p,i) => { if ((p.ed || 0) > t) out.push(`${i+1}쪽`); });
  if ((b.delAt || 0) > t) out.push("쪽 지움");
  return out;
}
const when = t => { const d = new Date(t), h = d.getHours();
  return `${d.getMonth()+1}월 ${d.getDate()}일 ${h < 12 ? "오전" : "오후"} ${h % 12 || 12}:${String(d.getMinutes()).padStart(2,"0")}`; };
function followHTML(b){
  if (b.rev !== "redo") return "";
  const ch = changedSince(b);
  return `<div class="note redo follow">
    <b>더 해 보기를 보낸 뒤 (${when(b.revAt)})</b>
    <p>선생님 말: ${esc(b.revMsg)}</p>
    <ul>
      <li>${b.revSeen ? `✓ 읽었어요 (${when(b.revSeen)})` : "✗ 아직 책을 열어 보지 않았어요"}</li>
      <li>${ch.length ? `고친 곳: ${ch.map(c => /쪽$/.test(c) ? `<a href="#" data-go="${parseInt(c)}">${c}</a>` : c === "표지" ? `<a href="#" data-go="0">표지</a>` : c).join(", ")}` : "고친 곳이 아직 없어요"}</li>
      <li>${b.done ? `✓ 다시 냈어요 (${when(b.doneAt)})${b.revReply ? ` — “${esc(b.revReply)}”` : ""}` : "아직 다시 내지 않았어요"}</li>
    </ul></div>`;
}
const revText = b => b.rev === "ok" ? '<b style="color:var(--coral)">★ 통과</b>'
  : b.done ? `<b style="color:var(--leaf)">✓ ${b.rev === "redo" ? "다시 냄" : "완료"}</b>`
  : b.rev === "redo" ? (b.revSeen ? "고치는 중" : "피드백 안 읽음") : "아직 만드는 중";

/* ---------- 완료 버튼 ---------- */
async function toggleDone(){
  const b = S.book;
  if (b.done){
    if (!await ask({ title:"완료 취소", text:"완료 표시를 지울까요?\n더 고치고 싶을 때 눌러요. 다 고치면 다시 '다 만들었어요'를 눌러 주세요.", ok:"완료 취소" })) return;
    await setDone(false); toast("완료를 취소했어요. 마저 고쳐 보세요"); return;
  }
  // 빠뜨린 곳이 있는지 살펴보고 알려 줘요 (그래도 완료는 할 수 있어요)
  const noText = [], noImg = [];
  b.pages.forEach((p,i) => {
    if (!p.text.trim()) noText.push(i+1);
    if (p.layout !== "text" && !S.imgs[p.pid]) noImg.push(i+1);
  });
  const miss = [];
  if (!b.title.trim()) miss.push("· 책 제목이 비어 있어요");
  if (noText.length) miss.push(`· 글이 없는 쪽: ${noText.join(", ")}쪽`);
  if (noImg.length) miss.push(`· 그림이 없는 쪽: ${noImg.join(", ")}쪽`);
  const text = miss.length
    ? `아직 빈 곳이 있어요.\n${miss.join("\n")}\n\n그래도 완료할까요?`
    : `모두 ${b.pages.length}쪽, 글과 그림이 다 들어 있어요.\n완료하면 선생님께 다 만들었다고 알려져요.\n완료한 뒤에도 고칠 수 있어요.`;
  if (!await ask({ title:"책을 다 만들었나요?", text, ok: miss.length ? "그래도 완료" : "완료하기", cancel:"더 고칠래요" })) return;
  let reply = null;
  if (b.rev === "redo"){
    const changed = changedSince(b);
    reply = await ask({ title:"무엇을 고쳤나요?",
      text:`선생님 말: ${b.revMsg}\n\n${changed.length ? `내가 고친 곳: ${changed.join(", ")}` : "아직 고친 곳이 없어요!"}\n선생님께 무엇을 고쳤는지 알려 주세요.`,
      input:{ placeholder:"예: 3쪽과 5쪽에 그림을 더 그렸어요" }, ok:"선생님께 내기", cancel:"더 고칠래요" });
    if (reply === false) return;
    if (!reply.trim()){ toast("무엇을 고쳤는지 한 줄 써 주세요"); return; }
  }
  if (await setDone(true, reply)) toast(b.rev === "redo" ? "다시 냈어요! 선생님 확인을 기다려요" : "완료! 멋진 그림책이 완성됐어요 🎉");
}
async function setDone(v, reply){
  await flushSave();
  const data = { done:v, doneAt: v ? Date.now() : null };
  if (reply) data.revReply = reply.trim().slice(0, 100);
  try {
    await api("PATCH", `books/${S.id}`, data);
    await api("PATCH", `shelf/${S.id}`, data);
    Object.assign(S.book, data); renderEditor(); return true;
  } catch(e){ toast("저장하지 못했어요. 인터넷을 확인하고 다시 눌러 주세요"); return false; }
}

  const b = S.book;
  document.querySelectorAll(".chip[data-p]").forEach(c => c.onclick = () => { S.page = +c.dataset.p; renderPages(); });
  $("#addPg").onclick = () => {

  const prev = () => { $("#prev").innerHTML = pageHTML(p, S.imgs[p.pid], S.page+1, true); fitText($("#prev")); };

  if ($("#pickImg") && !locked){
    const pick = () => { $("#pgFile").value = ""; $("#pgFile").click(); };
    $("#pickImg").onclick = pick;

    if (b.pages.length <= 1){ toast("책에는 적어도 한 쪽이 있어야 해요"); return; }
    if (!await ask({ title:`${S.page+1}쪽 지우기`, text:"글과 그림이 함께 사라져요.", ok:"지우기", danger:true })) return;
    if (S.grp){
      // 모둠 책: 지운 쪽만 순서에서 빼요 (다른 친구가 쓰는 쪽은 그대로)

      b.pages.splice(at, 1); if (!S.teacher) b.delAt = upd.delAt;
      if (S.imgs[p.pid]){ delete S.imgs[p.pid]; try { await api("DELETE", `imgs/${S.id}/${p.pid}`); } catch(e){} refreshThumb(); }
      pending = true; flushSave(); renderPages(); return;
    }
    const [x] = b.pages.splice(S.page,1); if (!S.teacher) b.delAt = Date.now();
    if (S.imgs[x.pid]){ delete S.imgs[x.pid]; try { await api("DELETE", `imgs/${S.id}/${x.pid}`); } catch(e){} refreshThumb(); }
    queueSave(); renderPages();
  };
}

/* ============================================================
   PDF 만들기 (선생님 모드) — 쪽마다 그림으로 그려서 담아요
   ============================================================ */
const PW = 1200, PH = 900, U = PW / 100;
const F_BODY = '"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const F_DISP = '"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const pdfName = b => `${b.num ? b.num + "번_" : ""}${b.author}_${b.title || "그림책"}.pdf`.replace(/[\\/:*?"<>|]/g, "");
function loadScript(src){ return new Promise((res,rej) => { const t = document.createElement("script"); t.src = src; t.onload = res; t.onerror = rej; document.head.appendChild(t); }); }
function rr(x, px, py, w, h, r){ x.beginPath(); x.moveTo(px+r,py); x.arcTo(px+w,py,px+w,py+h,r); x.arcTo(px+w,py+h,px,py+h,r); x.arcTo(px,py+h,px,py,r); x.arcTo(px,py,px+w,py,r); x.closePath(); }
function wrapLines(x, text, maxW){
  const out = [];
  for (const para of String(text).split("\n")){
    let line = "";
    for (const tok of para.split(/(\s+)/)){
      if (!tok) continue;
      if (/^\s+$/.test(tok)){ if (line) line += tok; continue; }
      if (x.measureText(line + tok).width <= maxW){ line += tok; continue; }
      if (line.trim()) out.push(line.trimEnd());
      let w = tok;
      while (x.measureText(w).width > maxW && w.length > 1){
        let k = 1; while (k < w.length && x.measureText(w.slice(0,k+1)).width <= maxW) k++;
        out.push(w.slice(0,k)); w = w.slice(k);
      }
      line = w;
    }
    out.push(line.trimEnd());
  }
  return out;
}
function fitLines(x, text, maxW, maxH, base, lh, fam){
  let size = base, lines;
  while (true){
    x.font = `${size}px ${fam}`; lines = wrapLines(x, text, maxW);
    if (lines.length * size * lh <= maxH || size < base * 0.45) return { size, lines, h: lines.length * size * lh };
    size *= 0.93;
  }
}
function drawLines(x, f, left, top, w, lh, align){
  x.textBaseline = "top"; x.textAlign = align;
  f.lines.forEach((l, i) => x.fillText(l, align === "center" ? left + w/2 : left, top + i*f.size*lh + f.size*(lh-1)/2));
  x.textAlign = "left";
}
function drawImg(x, img, px, py, w, h, cover, r){
  const s = cover ? Math.max(w/img.width, h/img.height) : Math.min(w/img.width, h/img.height);
  const iw = img.width*s, ih = img.height*s, ix = px + (w-iw)/2, iy = py + (h-ih)/2;
  x.save();
  if (cover){ x.beginPath(); x.rect(px,py,w,h); x.clip(); }
  else if (r){ rr(x, ix, iy, iw, ih, r); x.clip(); }
  x.drawImage(img, ix, iy, iw, ih); x.restore();
}
async function drawSlide(book, id, imgs, i){
  const c = document.createElement("canvas"); c.width = PW; c.height = PH;
  const x = c.getContext("2d"), n = book.pages.length, ink = "#1C2A48", soft = "#56627D";
  x.fillStyle = "#fff"; x.fillRect(0,0,PW,PH);
  const img = async src => src ? await loadImage(src) : null;
  if (i === 0){
    x.fillStyle = colorOf(id); x.fillRect(0,0,PW,PH);
    const first = book.pages.find(p => imgs[p.pid]);
    const im = await img(imgs.cover || (first && imgs[first.pid]));
    if (im) drawImg(x, im, 6*U, 6*U, PW-12*U, PH-32*U, false, 1.2*U);
    const t = fitLines(x, book.title || "제목 없는 책", PW-19.2*U, 5.4*U*1.2*2, 5.4*U, 1.2, F_DISP);
    const boxH = 5.2*U + t.h + 4.2*U, boxY = PH - 6*U - boxH;
    x.fillStyle = "#fff"; rr(x, 6*U, boxY, PW-12*U, boxH, 1.6*U); x.fill();
    x.fillStyle = ink; x.font = `${t.size}px ${F_DISP}`; drawLines(x, t, 9.6*U, boxY + 2.6*U, 0, 1.2, "left");
    x.fillStyle = soft; x.font = `${2.8*U}px ${F_BODY}`; x.textBaseline = "top";
    x.fillText(`지은이 ${book.author}`, 9.6*U, boxY + 2.6*U + t.h + 0.6*U);
  } else if (i === n+1){
    x.fillStyle = ink; x.textAlign = "center"; x.textBaseline = "middle";
    x.font = `${9*U}px ${F_DISP}`; x.fillText("끝", PW/2, PH/2 - 3*U);
    x.fillStyle = soft; x.font = `${3*U}px ${F_BODY}`; x.fillText(`${book.title} · 지은이 ${book.author}`, PW/2, PH/2 + 6*U);
    if (book.grp != null && crew(book).length){ x.font = `${2.4*U}px ${F_BODY}`; x.fillText(`함께 만든 친구: ${crew(book).join(", ")}`, PW/2, PH/2 + 11*U); }
    x.textAlign = "left";
  } else {
    const p = book.pages[i-1], im = await img(imgs[p.pid]);
    const lay = (!im && p.layout !== "text") ? "text" : p.layout, pad = 5*U, gap = 4*U, lh = 1.75;
    x.fillStyle = ink;
    if (lay === "side"){
      const cw = PW - 2*pad - gap, iw = cw*1.15/2.15, tw = cw - iw, h = PH - 2*pad;
      drawImg(x, im, pad, pad, iw, h, false, 1.2*U);
      const f = fitLines(x, p.text, tw, h, 3.4*U, lh, F_BODY);
      x.fillStyle = ink; drawLines(x, f, pad+iw+gap, pad + Math.max(0,(h - f.h)/2), tw, lh, "left");
    } else if (lay === "top"){
      const ch = PH - 2*pad - gap, ih = ch*1.5/2.5, th = ch - ih, w = PW - 2*pad;
      drawImg(x, im, pad, pad, w, ih, false, 1.2*U);
      const f = fitLines(x, p.text, w, th, 3.4*U, lh, F_BODY);
      x.fillStyle = ink; drawLines(x, f, pad, pad+ih+gap, w, lh, "center");
    } else if (lay === "full"){
      drawImg(x, im, 0, 0, PW, PH, true);
      if (p.text.trim()){
        const bw = PW - 8*U, f = fitLines(x, p.text, bw - 6*U, PH*0.4 - 4.8*U, 3.4*U, lh, F_BODY);
        const bh = f.h + 4.8*U, by = PH - 4*U - bh;
        x.fillStyle = "rgba(255,255,255,.9)"; rr(x, 4*U, by, bw, bh, 1.6*U); x.fill();
        x.fillStyle = ink; drawLines(x, f, 7*U, by + 2.4*U, bw - 6*U, lh, "left");
      }
    } else {
      const w = PW - 18*U, h = PH - 14*U, f = fitLines(x, p.text, w, h, 3.8*U, lh, F_BODY);
      drawLines(x, f, 9*U, 7*U + Math.max(0,(h - f.h)/2), w, lh, "center");
    }
    x.fillStyle = soft; x.font = `${2.2*U}px ${F_BODY}`; x.textAlign = "right"; x.textBaseline = "bottom";
    x.fillText(String(i), PW - 3*U, PH - 2*U); x.textAlign = "left";
  }
  return c.toDataURL("image/jpeg", 0.85);
}
let pdfBusy = false;
async function exportPDF(items, filename){
  if (pdfBusy){ toast("PDF를 만드는 중이에요. 잠시만요"); return; }
  pdfBusy = true;
  try {
    toast("PDF를 준비하고 있어요…");
    if (!window.jspdf) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
    try { await Promise.all([document.fonts.load(`40px ${F_BODY}`), document.fonts.load(`40px ${F_DISP}`)]); } catch(e){}
    const doc = new window.jspdf.jsPDF({ orientation:"landscape", unit:"px", format:[PW,PH], hotfixes:["px_scaling"] });
    let first = true;
    for (let k = 0; k < items.length; k++){
      let [id, book, imgs] = items[k];
      if (!book){ book = await api("GET", `books/${id}`); imgs = await api("GET", `imgs/${id}`) || {}; }
      if (!book) continue;
      book = normalize(book);
      if (items.length > 1) toast(`PDF 만드는 중… ${k+1} / ${items.length}권`);
      for (let i = 0; i < book.pages.length + 2; i++){
        const data = await drawSlide(book, id, imgs, i);
        if (!first) doc.addPage([PW,PH], "landscape");
        doc.addImage(data, "JPEG", 0, 0, PW, PH); first = false;
      }
    }
    doc.save(filename); toast("PDF를 받았어요");
  } catch(e){ console.error(e); toast("PDF를 만들지 못했어요. 인터넷을 확인하고 다시 해 보세요"); }
  pdfBusy = false;
}

/* ============================================================
   넘기는 그림책 보기
   ============================================================ */
async function cleanOrphan(id){
  if (!S.teacher){ toast("이 책은 내용이 없어요. 선생님께 말씀해 주세요"); showShelf(); return; }
  const sb = S.shelf[id] || {};
  const yes = await ask({ title:"빈 표지 정리", text:`${sb.author ? `${sb.num ? sb.num + "번 " : ""}${sb.author}의 표지인데 책 내용이 없어요.` : "이 표지에는 책 내용이 없어요."}\n(저장이 중간에 끊겼을 때 생길 수 있어요)\n책장에서 이 빈 표지를 지울까요?\n같은 학생의 진짜 책은 그대로 남아요.`, ok:"빈 표지 지우기", danger:true });
  if (yes){
    try { await api("DELETE", `shelf/${id}`); await api("DELETE", `imgs/${id}`); await api("DELETE", `comments/${id}`); toast("빈 표지를 지웠어요"); }
    catch(e){ toast("지우지 못했어요. 인터넷을 확인하세요"); }
  }
  showShelf();
}
async function openReader(id){
  stopLive();
  S.view="read"; S.idx=0;
  $("#app").innerHTML = `<div class="wrap"><p class="empty">책을 펼치고 있어요…</p></div>`;
  try {
    const [book, imgs] = await Promise.all([api("GET",`books/${id}`), api("GET",`imgs/${id}`)]);
    if (!book){ await cleanOrphan(id); return; }
    S.id=id; S.book=normalize(book); S.imgs=imgs||{}; S.isExample = isExample(book);
  } catch(e){ toast("책을 불러오지 못했어요. 인터넷을 확인하세요"); showShelf(); return; }
  const b = S.book;
  $("#app").innerHTML = `
  <div class="bar"><div class="in">
    <button class="btn ghost small" id="back">← 책장</button>
    <h2>${S.isExample ? "예시 · " : ""}${esc(b.title)}</h2>
    ${S.teacher ? `<span class="status">${b.grp != null ? `${esc(b.author)}${(groupsOf(themeOf(b))[b.grp-1] || []).length ? ` · ${groupsOf(themeOf(b))[b.grp-1].join(", ")}번` : ""}` : `${b.num ? b.num + "번 · " : ""}비밀번호 ${esc(b.pin)}`} · <span id="tSt">${revText(b)}</span></span>
      ${S.isExample ? "" : `<button class="btn pass small" id="tRev">선생님 확인</button>`}
      ${b.grp != null ? "" : `<button class="btn ghost small" id="tNum">번호 바꾸기</button>`}
      <button class="btn small" id="tEdit">고치기</button>
      <button class="btn sun small" id="tPdf">PDF 받기</button>
      <button class="btn danger small" id="tDel">책 지우기</button>` : ""}
  </div></div>
  ${S.teacher ? `<div style="height:14px"></div><div id="follow">${followHTML(b)}</div>` : ""}
  <div class="reader">
    <div class="stage" id="stage"><div class="sheet" id="under"></div><div class="sheet leaf" id="leaf"></div></div>
    <div class="nav">
      <button class="arrow" id="pv" aria-label="앞 쪽">‹</button>
      <span class="cnt" id="cnt"></span>
      <button class="arrow" id="nx" aria-label="다음 쪽">›</button>
    </div>
    ${b.grp != null ? `<p class="rdwho" id="rdWho"></p>` : ""}
    <section class="talk" id="talk"${S.isExample ? ' style="display:none"' : ""}>
      <h3 id="cmHead">친구들의 감상평</h3>
      <p class="cnt2" id="cmHint" style="margin:-4px 0 0">끝까지 읽으면 나도 감상평을 남길 수 있어요.</p>
      <div id="cmWrite" style="display:none">
      <div class="form">
        <select id="cmNum" aria-label="내 번호"></select>
        <textarea id="cmText" rows="2" maxlength="100" placeholder="예: 고양이가 말을 하는 장면이 재미있었어!"></textarea>
      </div>
      <div class="row" style="justify-content:space-between;margin-top:8px">
        <span class="cnt2" id="cmCnt">0 / 100자</span>
        <button class="btn sun small" id="cmGo">남기기</button>
      </div>
      </div>
      <ul class="cms" id="cms"></ul>
    </section>
  </div>`;
  S.comments = {};
  api("GET", `comments/${id}`).then(c => { S.comments = c || {}; renderComments(); }).catch(() => {});
  $("#cmNum").innerHTML = `<option value="">내 번호</option>` + rosterNums().map(n => {
    const f = bookByNum(n, ACTIVE) || bookByNum(n); return `<option value="${n}">${n}번${f ? " " + esc(f[1].author) : ""}</option>`;
  }).join("");
  $("#cmText").oninput = e => $("#cmCnt").textContent = `${e.target.value.length} / 100자`;
  $("#cmGo").onclick = async () => {
    const num = +$("#cmNum").value, text = $("#cmText").value.trim();
    if (!num){ toast("내 번호를 골라 주세요"); return; }
    if (b.grp != null ? groupOf(num, themeOf(b)) === +b.grp : +b.num === num){ toast(b.grp != null ? "우리 모둠 책에는 감상평을 쓸 수 없어요" : "내 책에는 감상평을 쓸 수 없어요"); return; }
    if (!text){ toast("감상평을 적어 주세요"); return; }
    const f = bookByNum(num, ACTIVE) || bookByNum(num), cid = uid();
    const c = { num, name: f ? f[1].author : "", text, created: Date.now() };
    try { await api("PUT", `comments/${id}/${cid}`, c); S.comments[cid] = c;
      $("#cmText").value = ""; $("#cmCnt").textContent = "0 / 100자"; renderComments(); toast("감상평을 남겼어요"); }
    catch(e){ toast("남기지 못했어요. 다시 해 보세요"); }
  };
  $("#back").onclick = showShelf;
  if (S.teacher){
    $("#tEdit").onclick = () => openEditor(id, b);
    const wireFollow = () => { $("#follow").innerHTML = followHTML(b);
      document.querySelectorAll("[data-go]").forEach(a => a.onclick = e => { e.preventDefault(); showSlide(+a.dataset.go); }); };
    wireFollow();
    if ($("#tRev")) $("#tRev").onclick = async () => {
      if (await openReview(id, b)){ $("#tSt").innerHTML = revText(b); wireFollow(); showSlide(S.idx);
        toast(b.rev === "ok" ? "통과로 표시했어요" : b.rev === "redo" ? "학생에게 더 해 볼 것을 남겼어요" : "확인을 지웠어요"); }
    };
    if ($("#tNum")) $("#tNum").onclick = async () => {
      const v = await ask({ title:"번호 바꾸기", text:`${b.author}의 번호를 적어 주세요.\n0번으로 바꾸면 예시 책이 돼요.`, input:{ mode:"numeric", value:b.num ? String(b.num) : "" }, ok:"바꾸기" });
      if (v === false) return;
      const n = +v.trim();
      if (!Number.isInteger(n) || n < 0){ toast("숫자로 적어 주세요 (0번은 예시 책)"); return; }
      try {
        S.shelf = await api("GET","shelf") || {};
        const other = bookByNum(n, themeOf(b));
        if (other && other[0] !== id){ toast(`${n}번은 이미 ${other[1].author}의 책이 있어요`); return; }
        await api("PATCH", `books/${id}`, { num:n }); await api("PATCH", `shelf/${id}`, { num:n });
        b.num = n; toast(`${n}번으로 바꿨어요`); openReader(id);
      } catch(e){ toast("바꾸지 못했어요. 다시 해 보세요"); }
    };
    $("#tPdf").onclick = () => exportPDF([[id, b, S.imgs]], pdfName(b));
    $("#tDel").onclick = async () => {
      if (!await ask({ title:"책 지우기", text:`'${b.title}' (${b.author})\n지우면 되돌릴 수 없어요.`, ok:"지우기", danger:true })) return;
      try { await api("DELETE",`shelf/${id}`); await api("DELETE",`books/${id}`); await api("DELETE",`imgs/${id}`); await api("DELETE",`comments/${id}`); toast("책을 지웠어요"); showShelf(); }
      catch(e){ toast("지우지 못했어요. 다시 해 보세요"); }
    };
  }
  $("#pv").onclick = () => turn(-1);
  $("#nx").onclick = () => turn(1);
  let x0 = null;
  const st = $("#stage");
  st.addEventListener("touchstart", e => x0 = e.touches[0].clientX, {passive:true});
  st.addEventListener("touchend", e => { if (x0==null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) turn(dx < 0 ? 1 : -1); x0 = null; });
  st.addEventListener("click", e => { const r = st.getBoundingClientRect(); turn(e.clientX - r.left > r.width/2 ? 1 : -1); });
  showSlide(0);
}
function renderComments(){
  const list = Object.entries(S.comments || {}).sort((a,b) => (b[1].created||0) - (a[1].created||0));
  const el = $("#cms"); if (!el) return;
  el.innerHTML = list.length ? list.map(([cid,c]) => {
    const d = new Date(c.created || 0);
    return `<li><div><b>${c.num}번 ${esc(c.name)}</b><small>${d.getMonth()+1}/${d.getDate()}</small><br>${esc(c.text)}</div>
      ${S.teacher ? `<button class="x" data-cid="${cid}">지우기</button>` : ""}</li>`;
  }).join("") : `<li style="color:var(--ink-soft)">아직 감상평이 없어요. 첫 번째로 남겨 보세요!</li>`;
  el.querySelectorAll("[data-cid]").forEach(x => x.onclick = async () => {
    if (!await ask({ title:"감상평 지우기", text:"이 감상평을 지울까요?", ok:"지우기", danger:true })) return;
    try { await api("DELETE", `comments/${S.id}/${x.dataset.cid}`); delete S.comments[x.dataset.cid]; renderComments(); }
    catch(e){ toast("지우지 못했어요"); }
  });
}
function slideCount(){ return S.book.pages.length + 2; }
function slideHTML(i){
  const b = S.book, n = b.pages.length;
  if (i === 0) return coverHTML(b, S.id, coverImg());
  if (i === n+1) return `<div class="pg end"><div><b>끝</b><br><span>${esc(b.title)} · 지은이 ${esc(b.author)}</span>${b.grp != null && crew(b).length ? `<br><span>함께 만든 친구: ${crew(b).map(esc).join(", ")}</span>` : ""}</div></div>`;
  const p = b.pages[i-1]; return pageHTML(p, S.imgs[p.pid], i, false);
}
function showSlide(i){
  S.idx = i; $("#under").innerHTML = slideHTML(i); fitText($("#under"));
  const bk = S.book, t = bk.revAt || 0;
  if (S.teacher && bk.rev === "redo" && i <= bk.pages.length && ((i === 0 ? bk.cvEd : bk.pages[i-1].ed) || 0) > t)
    $("#under").insertAdjacentHTML("beforeend", `<span class="fixed">고친 ${i === 0 ? "표지" : "쪽"}</span>`);
  const n = S.book.pages.length;
  $("#cnt").textContent = i===0 ? "표지" : i===n+1 ? "끝" : `${i} / ${n}`;
  $("#pv").disabled = i===0; $("#nx").disabled = i===slideCount()-1;
  if ($("#rdWho")){
    const p = i >= 1 && i <= n ? S.book.pages[i-1] : null;
    $("#rdWho").textContent = p ? (p.eds.length ? `이 쪽을 쓴 사람: ${p.eds.join(", ")}` : "")
      : crew(S.book).length ? `함께 만든 친구: ${crew(S.book).join(", ")}` : "";
  }
  if ($("#cmWrite")){
    const end = i === slideCount()-1;
    $("#cmWrite").style.display = end ? "" : "none";
    $("#cmHint").style.display = end ? "none" : "";
    $("#cmHead").textContent = end ? "다 읽었어요! 감상평을 남겨 주세요" : "친구들의 감상평";
  }
}
function turn(d){
  const to = S.idx + d;
  if (S.busy || to < 0 || to >= slideCount()) return;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || !Element.prototype.animate){ showSlide(to); return; }
  S.busy = true;
  const leaf = $("#leaf"), under = $("#under");
  leaf.style.display = "block";
  let frames;
  if (d > 0){ leaf.innerHTML = slideHTML(S.idx); under.innerHTML = slideHTML(to); fitText(leaf); fitText(under); frames = [{transform:"rotateY(0deg)"},{transform:"rotateY(-180deg)"}]; }
  else { leaf.innerHTML = slideHTML(to); fitText(leaf); frames = [{transform:"rotateY(-180deg)"},{transform:"rotateY(0deg)"}]; }
  leaf.animate(frames, { duration:650, easing:"cubic-bezier(.45,.05,.3,1)" }).onfinish = () => {
    leaf.style.display = "none"; showSlide(to); S.busy = false;
  };
}
document.addEventListener("keydown", e => {
  if (S.view !== "read") return;
  if (e.key === "ArrowRight") turn(1);
  if (e.key === "ArrowLeft") turn(-1);
});
window.addEventListener("beforeunload", () => { if (pending) flushSave(); });

showShelf();
